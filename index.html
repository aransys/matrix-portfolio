<!doctype html>
<!--
  Wake up, Neo…
  The Matrix has you…
  Follow the white rabbit: drop into the shell on the page and run  ls -a
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />

    <!-- Primary meta -->
    <title>Aurimas Ransys — Full Stack Developer</title>
    <meta
      name="description"
      content="Portfolio of Aurimas Ransys — full stack developer, CS student at Leeds Beckett University. Django, Python, JavaScript, and open to internships."
    />
    <meta name="author" content="Aurimas Ransys" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="canonical" href="https://ransys.dev/" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:site_name" content="ransys.dev" />
    <meta property="og:url" content="https://ransys.dev/" />
    <meta property="og:title" content="Aurimas Ransys — Full Stack Developer" />
    <meta
      property="og:description"
      content="Full stack developer from Lithuania, based in Leeds. Django, Python, modern JavaScript, and open to internships and collaboration."
    />
    <meta property="og:image" content="https://ransys.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Matrix-themed card reading AURIMAS RANSYS — full stack developer"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aurimas Ransys — Full Stack Developer" />
    <meta
      name="twitter:description"
      content="Full stack developer from Lithuania, based in Leeds. Django, Python, modern JavaScript, and open to internships and collaboration."
    />
    <meta name="twitter:image" content="https://ransys.dev/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Matrix-themed card reading AURIMAS RANSYS — full stack developer"
    />

    <!-- Fonts load straight from the document (not a CSS @import) so the
         browser discovers them before the app stylesheet has even parsed -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Space+Grotesk:wght@400;500;700&display=swap"
    />
  </head>
  <body style="background-color: #0a0a0a">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
